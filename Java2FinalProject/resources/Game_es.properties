Intro=¡Hola, bienvenidos a mi juego!
End=¡Gracias por jugar!
EarlyMorning=Te despiertas en plena noche, como si fuera un sueño. Una brisa helada del amanecer muerde tus mejillas en la oscuridad. Estás solo.
Morning=Te despiertas con la luz pálida de la mañana, como si fuera un sueño. Una brisa fría y aguda muerde tus mejillas mientras comienza el día. Estás solo.
Noon=Te despiertas bajo el sol del mediodía, como si fuera un sueño. A pesar del resplandor del mediodía, una brisa repentina y fría muerde tus mejillas. Estás solo.
Afternoon=Te despiertas con las largas sombras de la tarde, como si fuera un sueño. Una brisa fresca y fuerte muerde tus mejillas mientras la luz comienza a desaparecer. Estás solo.
Evening=Te despiertas bajo un manto de oscuridad al final de la tarde, como si fuera un sueño. Una brisa fría de la noche muerde tus mejillas. Estás solo.