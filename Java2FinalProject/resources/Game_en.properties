Intro=Hello, welcome to my game!
End=Thanks for playing!
EarlyMorning=You awaken in the dead of night, as if from a dream. A freezing, pre-dawn breeze bites at your cheeks in the dark. You are alone.
Morning=You awaken to pale morning light, as if from a dream. A sharp, chilly breeze bites at your cheeks as the day begins. You are alone.
Noon=You awaken beneath the high noon sun, as if from a dream. Despite the midday glare, a sudden, chilling breeze bites at your cheeks. You are alone.
Afternoon=You awaken to the long shadows of afternoon, as if from a dream. A sharp, cooling breeze bites at your cheeks as the light begins to fade. You are alone.
Evening=You awaken beneath a shroud of late evening darkness, as if from a dream. A sharp, night-chilled breeze bites at your cheeks. You are alone.